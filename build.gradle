// Monado's Android libraries read these names from the root project, so the
// names and versions mirror third_party/monado/build.gradle. Update both
// together when the submodule is bumped.
buildscript {
    ext {
        kotlinVersion = '2.0.0'

        latestAboutLibsRelease = '11.2.2'

        androidxCoreVersion = '1.15.0'
        androidxAnnotationVersion = '1.8.0'
        androidxAppCompatVersion = '1.7.0'
        androidxLifecycleVersion = '2.8.2'
        androidxConstraintLayoutVersion = '2.1.4'
        androidxCardViewVersion = '1.0.0'
        androidxRecyclerViewVersion = '1.3.2'

        hiltVersion = '2.51.1'

        materialVersion = '1.12.0'

        buildToolsVersion = '34.0.0'

        ktfmtVersion = "0.53"

        barcodeScannerViewVersion = "1.6.4"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:${latestAboutLibsRelease}"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
    }
}

plugins {
    id 'com.android.application' version '8.6.0' apply false
    id 'com.android.library' version '8.6.0' apply false

    id 'org.jetbrains.kotlin.android' version "$kotlinVersion" apply false

    // Reads eigenCMakeDir and pythonBinary from local.properties.
    id 'com.github.b3er.local.properties' version '1.1'

    // Applied by Monado's library modules.
    id "com.quittle.svg-2-android-vector" version "0.1.0" apply false
    id 'com.diffplug.spotless' version "6.22.0" apply false
}

ext {
    cmake_version = '3.22.1'
    ndk_version = '26.3.11579264'

    sharedCompileSdk = 35
    sharedTargetSdk = 31
    sharedMinSdk = 26

    // Off Linux, set eigenCMakeDir in local.properties.
    eigenCMakeDir = project.findProperty('eigenCMakeDir') ?: '/usr/share/eigen3/cmake'
    pythonBinary = project.findProperty('pythonBinary')
}
