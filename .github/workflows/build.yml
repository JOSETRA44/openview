name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libeigen3-dev \
            libvulkan-dev glslang-tools libsdl2-dev libx11-xcb-dev \
            libxcb-randr0-dev libxrandr-dev libgl-dev libopengl-dev libegl-dev \
            libudev-dev libbsd-dev libcjson-dev

      - name: Apply Monado patches
        run: git -C third_party/monado apply "$PWD"/patches/monado/*.patch

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # End to end: OpenXR loader -> libopenxr_openview -> IPC -> openview-service,
      # on a software Vulkan driver and a virtual X display.
      - name: Smoke test
        run: |
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libopenxr-utils
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          sleep infinity | xvfb-run -a build/runtime/openview-service > service.log 2>&1 &
          sleep 8
          XR_RUNTIME_JSON="$PWD/build/openxr_openview-dev.json" openxr_runtime_list || { cat service.log; exit 1; }
          tail -n 30 service.log

  # Baseline: Monado's own installable runtime, with our patches applied.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The APK version comes from `git describe`, which needs history and tags.
      - name: Fetch Monado history
        run: git -C third_party/monado fetch --unshallow --tags --filter=blob:none origin

      - name: Apply Monado patches
        run: git -C third_party/monado apply "$PWD"/patches/monado/*.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Build APK
        working-directory: third_party/monado
        run: ./gradlew --no-daemon assembleOutOfProcessDebug

      - uses: actions/upload-artifact@v4
        with:
          name: monado-outOfProcess-debug-apk
          path: third_party/monado/src/xrt/targets/openxr_android/build/outputs/apk/**/*.apk
