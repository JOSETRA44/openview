name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libeigen3-dev \
            libvulkan-dev glslang-tools libsdl2-dev libx11-xcb-dev \
            libxcb-randr0-dev libxrandr-dev libgl-dev libopengl-dev libegl-dev \
            libudev-dev libbsd-dev libcjson-dev

      - name: Apply Monado patches
        run: git -C third_party/monado apply "$PWD"/patches/monado/*.patch

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Tool tests
        run: |
          sudo apt-get install -y --no-install-recommends python3-numpy
          python3 tools/sensor-recorder/test_analyze.py
          python3 tools/bench/test_ate.py
          python3 tools/display-timing/test_measure.py
          cc -std=c11 -Wall -Wextra -Werror -I tracking/arcore/src tracking/arcore/tests/arcore_convention_test.c -o /tmp/arcore_convention_test -lm
          /tmp/arcore_convention_test
          c++ -std=c++17 android/experience/tests/camera_uv_test.cpp -o /tmp/camera_uv_test
          /tmp/camera_uv_test

      # End to end: OpenXR loader -> libopenxr_openview -> IPC -> openview-service,
      # on a software Vulkan driver and a virtual X display.
      - name: Smoke test
        run: |
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libopenxr-utils
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          sleep infinity | xvfb-run -a build/runtime/openview-service > service.log 2>&1 &
          sleep 8
          XR_RUNTIME_JSON="$PWD/build/openxr_openview-dev.json" openxr_runtime_list || { cat service.log; exit 1; }
          tail -n 30 service.log

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The About screen reports Monado's version from `git describe`.
      - name: Fetch Monado history
        run: git -C third_party/monado fetch --unshallow --tags --filter=blob:none origin

      - name: Apply Monado patches
        run: git -C third_party/monado apply "$PWD"/patches/monado/*.patch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK, CMake and host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools libeigen3-dev
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      # OpenCV is a hard dependency of the SLAM tracker; Monado finds it
      # in this SDK and links it statically into the service library.
      - name: OpenCV Android SDK (SLAM tracker dependency)
        run: |
          curl -sSL https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip -o opencv.zip
          unzip -q opencv.zip
          ls OpenCV-android-sdk/sdk/native/jni/

      - name: Build APK
        run: ./gradlew --no-daemon -PopencvAndroidSdkDir="$PWD/OpenCV-android-sdk" :app:assembleDebug :recorder:assembleDebug

      - name: Diagnose SLAM configuration
        if: always()
        run: |
          find android/app/.cxx -name CMakeCache.txt -exec grep -h "XRT_FEATURE_SLAM\|XRT_HAVE_OPENCV\|OpenCV_DIR\|OPENCV_ANDROID_SDK_DIR" {} \; || true

      - uses: actions/upload-artifact@v4
        with:
          name: openview-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sensor-recorder-debug-apk
          path: tools/sensor-recorder/app/build/outputs/apk/debug/*.apk

      # A green build used to hide the tracker being compiled out; make
      # its absence a hard failure instead.
      - name: Verify the SLAM tracker is in the APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -p "$APK" lib/arm64-v8a/libopenview-service.so > /tmp/service.so
          ok=1
          grep -a -q "VIT_SYSTEM_LIBRARY_PATH" /tmp/service.so || { echo "MISSING: SLAM tracker strings in the service library"; ok=0; }
          grep -a -q "SLAM_CAM_COUNT" /tmp/service.so || { echo "MISSING: SLAM_CAM_COUNT in the service library"; ok=0; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbasalt.so" || { echo "MISSING: libbasalt.so in the APK"; ok=0; }
          test "$ok" = 1

  # Independent client: iterate on the product without waiting for the native runtime build.
  experience:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android client build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Build OpenView experience
        run: ./gradlew --no-daemon :experience:assembleDebug :experience:testDebugUnitTest
      - name: Tracking-test analyser
        run: python3 -m unittest discover -s tools/tracking-test -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: openview-experience-debug-apk
          path: android/experience/build/outputs/apk/debug/*.apk
