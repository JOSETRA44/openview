name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libeigen3-dev \
            libvulkan-dev glslang-tools libsdl2-dev libx11-xcb-dev \
            libxcb-randr0-dev libxrandr-dev libgl-dev libegl-dev \
            libudev-dev libbsd-dev libcjson-dev

      - name: Apply Monado patches
        run: git -C third_party/monado apply "$PWD"/patches/monado/*.patch

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
