plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'dev.openview.recorder'
    compileSdk project.sharedCompileSdk
    buildToolsVersion = buildToolsVersion

    defaultConfig {
        applicationId 'dev.openview.recorder'
        // SessionConfiguration (API 28) is the non-deprecated way to open a camera session.
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
}
